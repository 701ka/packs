<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Login - EditorPack</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Space+Grotesk:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="../style/style.css" />
    <link rel="stylesheet" href="../style/notify.css" />
    <link rel="stylesheet" href="../style/login.css" />
  </head>
  <body>
    <nav class="nav">
      <a href="/" class="nav-logo">EditorPack</a>
    </nav>
    <div class="auth-container">
      <div class="auth-box">
        <div class="auth-title">Kirish</div>
        <div class="auth-sub">Akkauntingizga kiring</div>
        <div class="auth-error" id="error"></div>
        <form onsubmit="login(event)">
          <input
            class="auth-input"
            type="email"
            id="email"
            placeholder="Email"
            required
          />
          <div class="password-field">
            <input
              class="auth-input"
              type="password"
              id="password"
              placeholder="Parol"
              required
            />
            <button
              class="password-toggle"
              type="button"
              aria-label="Show password"
              onclick="togglePassword(this, 'password')"
            >
              eye
            </button>
          </div>
          <button class="auth-btn" type="submit">Kirish</button>
        </form>
        <div class="auth-link">
          Akkaunt yo'qmi? <a href="signup.html">Ro'yxatdan o'ting</a>
        </div>
      </div>
    </div>
    <script src="../js/notify.js"></script>
    <script src="../js/config.js"></script>
    <script src="../js/preferences.js"></script>
    <script src="../js/password-toggle.js"></script>
    <script src="../js/login.js"></script>
  </body>
</html>
